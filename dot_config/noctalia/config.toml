[bar.default]
border = "on_surface"
margin_ends = 0
start = [ "launcher", "workspaces" ]

[calendar]

[control_center.calendar]
show_week_numbers = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Fira Sans"

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty", "niri" ]

[wallpaper.default]
path = "/home/aravind/Documents/Pictures/wallhaven-yqj6j7.jpg"

[wallpaper.last]
path = "/home/aravind/Documents/Pictures/wallhaven-yqj6j7.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/aravind/Documents/Pictures/wallhaven-yqj6j7.jpg"

[widget.battery]
display_mode = "graphic"

[widget.clock]
format = "{:%A %Y-%m-%d %H:%M:%S}"

[widget.launcher]
custom_image = "/usr/share/icons/cachyos.svg"
scale = 1.3500000000000001

[widget.media]
album_art_only = true

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.workspaces]
style = "minimal"
